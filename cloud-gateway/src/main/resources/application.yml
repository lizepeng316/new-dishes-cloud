server:
  port: 9090

spring:
  application:
    name: gateway

  config:
    # Data ID:gateway.yml
    import:
      - nacos:${spring.application.name}.yml
      - nacos:upload-service.yml

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: et2512
      config:
        namespace: et2512

    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowed-headers: "*"
                max-age: 3600
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS